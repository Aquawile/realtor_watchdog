name: DRE ingestion

# Refresh of Orange County realtors from the CA DRE licensee bulk file.
# Schedule intentionally disabled: the owner has not approved the first write
# to `realtors`, and the cadence is being redesigned (weekly fingerprint check).
# Manual runs only until then.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (read-only, print counts)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: dre-network # never overlaps another job that calls DRE
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/checks.yml

  ingest:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (3 attempts)
        run: for i in 1 2 3; do npm ci && break; [ "$i" = 3 ] && exit 1; sleep 15; done
      - name: Ingest DRE licensees
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/ingest-dre.mts ${{ inputs.dry_run && '--dry-run' || '' }}
