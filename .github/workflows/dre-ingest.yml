name: DRE ingestion

# Twice-monthly refresh of Orange County realtors (`realtors`) from the CA DRE
# licensee bulk file: raw copy stored first, then a fingerprint check writes
# only new/changed realtors and flags those no longer in scope.
# (Approved 2026-10-07: first load + fingerprint refresh; twice monthly from 2026-10-08.)
on:
  schedule:
    - cron: "0 11 1,15 * *" # 1st and 15th, 11:00 UTC (4 AM PDT / 3 AM PST), after DRE's overnight update
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (stores the raw bulk file, prints counts, writes nothing to realtors)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: dre-network # never overlaps another job that calls DRE
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/checks.yml

  ingest:
    needs: test # nothing is written unless every check and test passed
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (3 attempts)
        run: for i in 1 2 3; do npm ci && break; [ "$i" = 3 ] && exit 1; sleep 15; done
      - name: Ingest DRE licensees
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        # Scheduled runs have no inputs, so they write; manual runs default to dry run.
        run: node scripts/ingest-dre.mts ${{ inputs.dry_run && '--dry-run' || '' }}
