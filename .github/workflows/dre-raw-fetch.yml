name: DRE raw fetch

# Raw layer: stores DRE public license lookup pages byte-for-byte in the
# private Supabase bucket 'dre-raw' (see scripts/fetch-dre-pages.mts).
# Manual only. Start with mode=selftest, then small batches.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "selftest = check runner, secrets, Supabase and DRE without storing pages; fetch = run a batch"
        type: choice
        options: [selftest, fetch]
        default: selftest
      limit:
        description: "Pages in this batch (fetch mode)"
        type: number
        default: 100
      max_concurrency:
        description: "Override max parallel requests for this run (blank = repository variable DRE_MAX_CONCURRENCY)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: dre-network # never overlaps another job that calls DRE
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/checks.yml

  fetch:
    needs: test # nothing is fetched unless every check and test passed
    runs-on: ubuntu-latest
    # The script stops itself at 300 min; this is the hard ceiling. On timeout
    # or cancel, GitHub signals the script, which finishes in-flight pages and
    # records the stop. A runner that dies outright is detected by the next run
    # (silent heartbeat -> batch marked abandoned) and its pages are re-fetched.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (3 attempts)
        run: for i in 1 2 3; do npm ci && break; [ "$i" = 3 ] && exit 1; sleep 15; done
      - name: Fetch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MODE: ${{ inputs.mode }}
          LIMIT: ${{ inputs.limit }}
          MAX_CONCURRENCY_OVERRIDE: ${{ inputs.max_concurrency }}
          # Pacing guardrail, tunable in Settings -> Secrets and variables -> Actions -> Variables.
          # Unset variables fall back to the tested defaults in scripts/lib/raw-fetch-core.mts.
          DRE_START_CONCURRENCY: ${{ vars.DRE_START_CONCURRENCY }}
          DRE_MAX_CONCURRENCY: ${{ vars.DRE_MAX_CONCURRENCY }}
          DRE_WINDOW: ${{ vars.DRE_WINDOW }}
          DRE_SOFT_LIMIT_MS: ${{ vars.DRE_SOFT_LIMIT_MS }}
          DRE_HARD_LIMIT_MS: ${{ vars.DRE_HARD_LIMIT_MS }}
          DRE_VERY_SLOW_PAUSE_MS: ${{ vars.DRE_VERY_SLOW_PAUSE_MS }}
          DRE_SLOW_STREAK_STOP: ${{ vars.DRE_SLOW_STREAK_STOP }}
          DRE_MAX_CONSECUTIVE_ERRORS: ${{ vars.DRE_MAX_CONSECUTIVE_ERRORS }}
          DRE_MAX_ERROR_RATE: ${{ vars.DRE_MAX_ERROR_RATE }}
          DRE_REQUEST_TIMEOUT_MS: ${{ vars.DRE_REQUEST_TIMEOUT_MS }}
          DRE_VERIFY_CONCURRENCY: ${{ vars.DRE_VERIFY_CONCURRENCY }}
        run: |
          if [ "$MODE" = "selftest" ]; then
            node scripts/fetch-dre-pages.mts --selftest
          elif [ -n "$MAX_CONCURRENCY_OVERRIDE" ]; then
            node scripts/fetch-dre-pages.mts --limit "$LIMIT" --max-concurrency "$MAX_CONCURRENCY_OVERRIDE" --max-minutes 300
          else
            node scripts/fetch-dre-pages.mts --limit "$LIMIT" --max-minutes 300
          fi
      - name: Note abnormal end
        if: failure() || cancelled()
        run: |
          echo "### Run did not complete normally" >> "$GITHUB_STEP_SUMMARY"
          echo "Exit code 2 = stopped by a guardrail (see reason above); 1 = crash or verification failure. Nothing is lost: unfinished or failed pages are fetched again by the next batch." >> "$GITHUB_STEP_SUMMARY"

  # Auto-route: after a successful fetch batch, process the new raw pages.
  process:
    needs: fetch
    if: ${{ success() && inputs.mode == 'fetch' }}
    uses: ./.github/workflows/dre-process.yml
    secrets: inherit
